<!DOCTYPE html>
<html>
<head>
    <title>Password Reset OTP</title>
</head>

<body>

    <h2>Password Reset</h2>

    <p>Hello {{ username }},</p>

    <p>
        We received a request to reset your password.
    </p>

    <p>Your OTP is:</p>

    <h1>{{ otp }}</h1>

    <p>
        This OTP is valid for 5 minutes.
    </p>

    <p>
        If you did not request a password reset,
        please ignore this email.
    </p>

    <p>
        Regards,<br>
        Task Management API
    </p>

</body>
</html>
